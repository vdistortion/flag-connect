<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlagConnect — flag quiz</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#17212b" />
    <style>
      html.telegram-miniapp body {
        margin: 0;
      }

      html.telegram-miniapp app-header {
        display: none;
      }

      html.locale-pending app-root {
        visibility: hidden;
      }

      #locale-debug-panel {
        position: fixed;
        z-index: 10000;
        top: 8px;
        right: 8px;
        max-width: min(360px, calc(100vw - 16px));
        padding: 10px 12px;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 8px;
        color: #ffffff;
        background: rgb(15 23 42 / 92%);
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        pointer-events: none;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (() => {
        const webApp = window.Telegram?.WebApp;
        const languageTag =
          webApp?.initDataUnsafe?.user?.language_code ??
          navigator.languages[0] ??
          navigator.language;
        const language = languageTag.toLowerCase().startsWith('ru') ? 'ru' : 'en';
        const root = document.documentElement;

        if (root.lang !== language) root.classList.add('locale-pending');
        root.lang = language;

        if (!webApp) return;

        const applyTheme = () => {
          root.classList.add('telegram-miniapp');
          for (const [key, value] of Object.entries(webApp.themeParams ?? {})) {
            if (typeof value === 'string') {
              root.style.setProperty(`--tg-theme-${key.replaceAll('_', '-')}`, value);
            }
          }
          root.style.colorScheme = webApp.colorScheme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor && webApp.themeParams.bg_color) {
            themeColor.setAttribute('content', webApp.themeParams.bg_color);
          }
        };

        applyTheme();
        webApp.onEvent('themeChanged', applyTheme);
      })();
    </script>
  </head>
  <body>
    <aside id="locale-debug-panel" role="status" aria-live="polite"></aside>
    <app-root ngSkipHydration></app-root>
  </body>
</html>

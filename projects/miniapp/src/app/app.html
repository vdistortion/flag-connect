<a class="miniapp-skip-link" href="#main-content">{{
  language() === 'ru' ? 'К содержимому' : 'Skip to content'
}}</a>
@if (!tg.isApp()) {
  <nav
    class="miniapp-browser-nav"
    [attr.aria-label]="language() === 'ru' ? 'Навигация' : 'Navigation'"
  >
    <a routerLink="/">FlagConnect</a>
    <a routerLink="/settings">{{ language() === 'ru' ? 'Настройки' : 'Settings' }}</a>
  </nav>
}
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

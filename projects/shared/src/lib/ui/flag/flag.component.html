<div
  class="flag"
  [class.aspect-ratio-75]="aspectRatio() === 75"
  [class.success]="success()"
  [class.error]="error()"
>
  <div class="flag__wrapper">
    @if (image().length > 1) {
      <div class="flag__icon">
        <button
          class="flag__variant-button"
          type="button"
          [attr.aria-label]="messages().showAnotherFlag + ': ' + name()"
          (click)="nextFlag()"
        >
          <app-icon icon="mdi/image-multiple-outline"></app-icon>
        </button>
      </div>
    }
    @if (imageSource(); as source) {
      @if (selectable()) {
        <button
          class="flag__image-button"
          type="button"
          [disabled]="disabled()"
          [attr.aria-label]="messages().selectFlag + ': ' + name()"
          (click)="selectFlag()"
        >
          <img class="flag__image" [ngSrc]="source" [alt]="''" [priority]="priority()" fill />
        </button>
      } @else {
        <img class="flag__image" [ngSrc]="source" [alt]="name()" [priority]="priority()" fill />
      }
    }
  </div>
</div>

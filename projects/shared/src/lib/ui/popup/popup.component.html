<div class="popup">
  <button
    class="popup__overlay"
    type="button"
    tabindex="-1"
    aria-hidden="true"
    [attr.aria-label]="messages().closeImage"
    (click)="close.emit()"
  ></button>
  <section
    class="popup__content"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="messages().countryFlag"
  >
    <button
      #closeButton
      class="popup__close"
      type="button"
      [attr.aria-label]="messages().close"
      (click)="close.emit()"
    >
      <app-icon icon="mdi/close-circle-outline"></app-icon>
    </button>
    <ng-content></ng-content>
  </section>
</div>

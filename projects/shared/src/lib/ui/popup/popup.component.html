<div class="popup">
  <button
    class="popup__overlay"
    type="button"
    tabindex="-1"
    aria-hidden="true"
    aria-label="Закрыть изображение"
    (click)="close.emit()"
  ></button>
  <section class="popup__content" role="dialog" aria-modal="true" aria-label="Флаг страны">
    <button
      #closeButton
      class="popup__close"
      type="button"
      aria-label="Закрыть"
      (click)="close.emit()"
    >
      <app-icon icon="mdi/close-circle-outline"></app-icon>
    </button>
    <ng-content></ng-content>
  </section>
</div>

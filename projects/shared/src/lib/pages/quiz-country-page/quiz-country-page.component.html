<div class="wrapper" [class.telegram-layout]="quizService.usesTelegramMainButton">
  @if (quizService.correctCountry(); as correctCountry) {
    <h1 class="name">{{ correctCountry.name.ru }}</h1>
  }

  <div class="countries">
    @for (country of quizService.countries(); track country.name.en; let index = $index) {
      <app-flag
        class="flag"
        [aspectRatio]="75"
        [success]="quizService.hasAnswered() && index === quizService.correctAnswerIndex()"
        [error]="
          quizService.hasAnswered() &&
          index === quizService.answerIndex() &&
          index !== quizService.correctAnswerIndex()
        "
        [image]="country.flag"
        [name]="country.name.ru"
        [selectable]="true"
        [disabled]="quizService.hasAnswered()"
        (selected)="quizService.selectAnswer(index)"
      ></app-flag>
    }

    @if (quizService.hasAnswered() && !quizService.usesTelegramMainButton) {
      <app-button [country]="true" (clicked)="quizService.nextQuestion()">Далее</app-button>
    }
  </div>
</div>

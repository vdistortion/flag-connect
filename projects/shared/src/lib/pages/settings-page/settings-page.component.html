<div class="wrapper">
  <table>
    <caption>
      Настройки
    </caption>
    <tbody>
      <tr>
        <th scope="row">Количество вариантов</th>
        <td>{{ settings.count() }}</td>
        <td>
          <label class="visually-hidden" for="answer-count">Количество вариантов ответа</label>
          <input
            id="answer-count"
            type="range"
            [value]="settings.count()"
            [min]="minCount"
            [max]="maxCount"
            (input)="setCount($event)"
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>

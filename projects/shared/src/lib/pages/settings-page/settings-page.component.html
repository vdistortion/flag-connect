<div class="wrapper">
  <table>
    <caption>
      {{
        messages().settings
      }}
    </caption>
    <tbody>
      <tr>
        <th scope="row">{{ messages().answerCount }}</th>
        <td>{{ settings.count() }}</td>
        <td>
          <label class="visually-hidden" for="answer-count">{{
            messages().answerCountLabel
          }}</label>
          <input
            id="answer-count"
            type="range"
            [value]="settings.count()"
            [min]="minCount"
            [max]="maxCount"
            (input)="setCount($event)"
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>

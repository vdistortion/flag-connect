<div class="wrapper">
  <table>
    <caption>
      {{
        messages().settings
      }}
    </caption>
    <tbody>
      <tr>
        <th scope="row">{{ messages().answerCount }}</th>
        <td colspan="2">
          <div class="answer-count-control">
            <label class="visually-hidden" for="answer-count">
              {{ messages().answerCountLabel }}
            </label>
            <input
              id="answer-count"
              type="range"
              [value]="settings.count()"
              [min]="minCount"
              [max]="maxCount"
              [disabled]="settings.noChoices()"
              (input)="setCount($event)"
            />
            <output for="answer-count">{{ settings.count() }}</output>
          </div>
        </td>
      </tr>
      <tr>
        <td colspan="3">
          <label class="no-choices-control">
            <input
              type="checkbox"
              [checked]="settings.noChoices()"
              (change)="setNoChoices($event)"
            />
            {{ messages().noChoices }}
          </label>
        </td>
      </tr>
    </tbody>
  </table>
</div>

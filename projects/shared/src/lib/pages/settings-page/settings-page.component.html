<div class="wrapper">
  <table>
    <caption>
      {{
        messages().settings
      }}
    </caption>
    <tbody>
      <tr>
        <th scope="row">{{ messages().answerCount }}</th>
        <td colspan="2">
          <label class="visually-hidden" for="answer-count">{{
            messages().answerCountLabel
          }}</label>
          <select id="answer-count" [value]="settings.count()" (change)="setCount($event)">
            <option [value]="noChoicesCount">{{ messages().noChoices }}</option>
            @for (count of choiceCounts; track count) {
              <option [value]="count">{{ count }}</option>
            }
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>

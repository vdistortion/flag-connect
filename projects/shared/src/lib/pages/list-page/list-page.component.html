<div class="wrapper">
  @if (status() === 'loading') {
    <p role="status">{{ messages().loadingCountries }}</p>
  } @else if (status() === 'error') {
    <div role="alert">
      <p>{{ messages().countriesError }}</p>
      <button type="button" (click)="retry()">{{ messages().retry }}</button>
    </div>
  }
  <div class="flags">
    @for (country of countries(); track country.code) {
      <div>
        <h2 class="name">{{ country.name[language()] }}</h2>
        <app-flag
          [image]="country.flag"
          [name]="country.name[language()]"
          [selectable]="true"
          (selected)="showPopup($event, country.name[language()])"
        ></app-flag>
      </div>
    }
  </div>
  @if (popup(); as preview) {
    <app-popup (close)="hidePopup()">
      <div class="flag-preview">
        <img [ngSrc]="preview.src" [alt]="preview.alt" fill />
      </div>
    </app-popup>
  }
</div>

name: Deploy to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flag-connect-vps-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Prepare project checkout on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$VERIFIED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$VERIFIED_COMMIT'" <<'DEPLOY'
          set -euo pipefail
          verified_commit="$1"
          project_dir="$HOME/projects/flag-connect"
          mkdir -p "$HOME/projects"

          if [ ! -e "$project_dir/.git" ]; then
            if [ -d "$project_dir" ] && [ -n "$(ls -A "$project_dir")" ]; then
              echo "$project_dir exists but is not a Git checkout; refusing to overwrite it." >&2
              exit 1
            fi
            git clone --branch main --single-branch \
              https://github.com/vdistortion/flag-connect.git "$project_dir"
          else
            cd "$project_dir"
            if [ "$(git branch --show-current)" != main ]; then
              echo "Deploy requires the main branch in $project_dir." >&2
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "Checkout has local changes; refusing to update it." >&2
              exit 1
            fi
            git fetch --prune origin
            remote_commit="$(git rev-parse refs/remotes/origin/main)"
            if [ "$remote_commit" != "$verified_commit" ]; then
              echo "main changed after verification; start a new deployment." >&2
              exit 1
            fi
            if git merge-base --is-ancestor HEAD "$remote_commit"; then
              git merge --ff-only "$remote_commit"
            elif [ -z "$(git status --porcelain)" ]; then
              echo "Upstream history was rewritten; updating the clean checkout." >&2
              git reset --hard "$remote_commit"
              git reflog expire --expire=now --all
              git gc --prune=now
            else
              echo "Checkout has local changes; refusing to replace it after upstream history rewrite." >&2
              exit 1
            fi
          fi

          if [ "$(git -C "$project_dir" rev-parse HEAD)" != "$verified_commit" ]; then
            echo "Checkout does not match the verified commit; start a new deployment." >&2
            exit 1
          fi

          if ! docker network inspect caddy >/dev/null 2>&1; then
            echo "Start vps-infra/caddy and its Docker network before deploying FlagConnect." >&2
            exit 1
          fi
          if ! docker network inspect garage >/dev/null 2>&1; then
            echo "Start vps-infra/garage and its Docker network before deploying FlagConnect." >&2
            exit 1
          fi
          if [ ! -s "$project_dir/deploy/.env.garage" ]; then
            echo "Create $project_dir/deploy/.env.garage with a Garage read-only key before deploying." >&2
            exit 1
          fi
          DEPLOY

      - name: Write runtime settings to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$MINIAPP_URL"
          case "$MINIAPP_URL" in
            https://*) ;;
            *) echo "MINIAPP_URL must start with https://" >&2; exit 1 ;;
          esac
          case "$TELEGRAM_BOT_TOKEN$MINIAPP_URL" in
            *$'\n'*|*$'\r'*) echo "Runtime settings must be single-line values." >&2; exit 1 ;;
          esac

          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'MINIAPP_URL=%s\n' "$MINIAPP_URL"
          } | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            'umask 077 && cat > "$HOME/projects/flag-connect/deploy/.env.bot"'

      - name: Build and start services on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            'cd "$HOME/projects/flag-connect" && docker compose --parallel 1 -f deploy/compose.yaml build && docker compose --profile asset-sync -f deploy/compose.yaml pull flags-sync && docker compose --profile asset-sync -f deploy/compose.yaml run --rm --no-deps flags-sync && docker compose -f deploy/compose.yaml up -d --no-build --remove-orphans'

name: flag-connect

services:
  miniapp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: miniapp
    restart: unless-stopped
    volumes:
      - flag-connect-generated:/usr/share/nginx/html/images/generated:ro
    networks:
      - caddy
    labels:
      caddy: miniapp.flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 80}}'

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
    networks:
      - caddy
    labels:
      caddy: flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 4000}}'

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: bot
    restart: unless-stopped
    env_file:
      - .env.bot
    environment:
      FLAG_ASSETS_DIR: /flags
      GENERATED_FLAGS_DIR: /generated
    volumes:
      - flag-connect-generated:/generated

networks:
  caddy:
    external: true

volumes:
  flag-connect-generated:
    name: flag-connect-generated

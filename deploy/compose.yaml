name: flag-connect

services:
  miniapp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: miniapp
    restart: unless-stopped
    volumes:
      - flag-connect-flags:/usr/share/nginx/html/images/flags:ro
      - flag-connect-generated:/usr/share/nginx/html/images/generated:ro
    networks:
      - caddy
    labels:
      caddy: miniapp.flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 80}}'

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
    volumes:
      - flag-connect-flags:/app/dist/web/browser/images/flags:ro
      - flag-connect-generated:/app/dist/web/browser/images/generated:ro
    networks:
      - caddy
    labels:
      caddy: flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 4000}}'

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: bot
    restart: unless-stopped
    env_file:
      - .env.bot
    environment:
      FLAG_ASSETS_DIR: /flags
      GENERATED_FLAGS_DIR: /generated
    volumes:
      - flag-connect-flags:/flags:ro
      - flag-connect-generated:/generated

  flags-sync:
    image: rclone/rclone:latest
    profiles:
      - asset-sync
    restart: 'no'
    entrypoint: ['rclone']
    command:
      [
        'sync',
        'garage:flag-connect-assets',
        '/flags',
        '--delete-before',
        '--exclude',
        'generated/**',
      ]
    env_file:
      - .env.garage
    volumes:
      - flag-connect-flags:/flags
    networks:
      - garage

networks:
  caddy:
    external: true
  garage:
    external: true

volumes:
  flag-connect-flags:
    name: flag-connect-flags
  flag-connect-generated:
    name: flag-connect-generated

name: flag-connect

services:
  miniapp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: miniapp
    restart: unless-stopped
    volumes:
      - flag-connect-flags:/usr/share/nginx/html/images/flags:ro
    networks:
      - caddy
    labels:
      caddy: miniapp.flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 80}}'

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
    volumes:
      - flag-connect-flags:/app/dist/web/browser/images/flags:ro
    networks:
      - caddy
    labels:
      caddy: flag-connect.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 4000}}'

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: bot
    restart: unless-stopped
    env_file:
      - .env.bot

  flags-sync:
    image: rclone/rclone:latest
    profiles:
      - asset-sync
    restart: 'no'
    entrypoint: ['rclone']
    command: ['sync', 'garage:flag-connect-assets', '/flags', '--delete-before']
    env_file:
      - .env.garage
    volumes:
      - flag-connect-flags:/flags
    networks:
      - garage

networks:
  caddy:
    external: true
  garage:
    external: true

volumes:
  flag-connect-flags:
    name: flag-connect-flags
